name: Build and deploy ASP.NET Core API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AzurePortfolio.Api.csproj

      - name: Build
        run: dotnet build AzurePortfolio.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AzurePortfolio.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: abrtx-dotnet-api
          package: ./publish
